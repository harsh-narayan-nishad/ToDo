<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Pacewise To-do: a rounded app tile in a warm amber-to-coral gradient, a soft white tile inside, and a bold tick. -->
  <defs>
    <linearGradient id="bg" x1="6" y1="4" x2="58" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFB547"/>
      <stop offset="0.55" stop-color="#FF7A45"/>
      <stop offset="1" stop-color="#EF4F5E"/>
    </linearGradient>
    <linearGradient id="tick" x1="20" y1="22" x2="46" y2="44" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FF8A3D"/>
      <stop offset="1" stop-color="#EB4A5A"/>
    </linearGradient>
    <linearGradient id="shine" x1="32" y1="0" x2="32" y2="34" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect x="2" y="2" width="60" height="60" rx="15" fill="url(#bg)"/>
  <rect x="2" y="2" width="60" height="60" rx="15" fill="url(#shine)"/>
  <rect x="15" y="15" width="34" height="34" rx="10.5" fill="#FFFFFF"/>
  <path d="M22.5 32.5 L29 39 L42 25" fill="none" stroke="url(#tick)" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
